name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate repository
        shell: pwsh
        run: ./scripts/validate_repo.ps1

      - name: Explain native build boundary
        shell: pwsh
        run: Write-Host "Native compilation requires the matching local Teamfight Manager 2 Mod SDK and is performed for releases."
